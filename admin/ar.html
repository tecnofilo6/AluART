<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>


<!-- A-FRAME -->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


<!-- MINDAR -->

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

body {
    margin: 0;
    overflow: hidden;
}

#mensaje {

    position: fixed;

    top: 15px;

    left: 0;

    right: 0;

    text-align: center;

    color: white;

    font-family: Arial;

    font-size: 18px;

    z-index: 9999;

    text-shadow:
        0 0 5px black,
        0 0 5px black;

}

</style>

</head>


<body>


<div id="mensaje">

Cargando AluARTmx AR...

</div>


<a-scene

    mindar-image="
        imageTargetSrc: ./targets.mind;
        maxTrack: 1;
    "

    color-space="sRGB"

    renderer="
        colorManagement: true;
        physicallyCorrectLights;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="
        enabled: false
    "

    embedded
>


    <!-- CÁMARA -->

    <a-camera

        position="0 0 0"

        look-controls="enabled: false"

        active="true"

    ></a-camera>


    <!-- VIDEO -->

    <a-assets>

        <video

            id="videoAR"

            src="./10megas.mp4"

            loop

            crossorigin="anonymous"

            playsinline

            webkit-playsinline

            muted

        ></video>

    </a-assets>


    <!-- TARGET -->

    <a-entity

        mindar-image-target="
            targetIndex: 0
        "

    >

        <a-video

            src="#videoAR"

            position="0 0 0"

            width="1"

            height="0.5625"

            rotation="0 0 0"

        ></a-video>

    </a-entity>


</a-scene>


<script>


const mensaje =
    document.getElementById("mensaje");


const escena =
    document.querySelector("a-scene");


const video =
    document.getElementById("videoAR");


escena.addEventListener(
    "loaded",
    function () {

        mensaje.innerText =
            "Cámara lista. Apunta al cuadro.";

    }
);


escena.addEventListener(
    "targetFound",
    function () {

        mensaje.innerText =
            "¡CUADRO DETECTADO!";

        video.play();

    }
);


escena.addEventListener(
    "targetLost",
    function () {

        mensaje.innerText =
            "Apunta al cuadro.";

        video.pause();

    }
);


</script>


</body>

</html>

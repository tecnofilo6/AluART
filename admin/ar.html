
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>AluARTmx AR v3.1</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #estado {
      position: fixed;
      z-index: 100;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      text-align: center;
      font-size: 14px;
      max-width: 90%;
      pointer-events: none;
    }

    #sonido {
      position: fixed;
      z-index: 101;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      padding: 13px 22px;
      border: none;
      border-radius: 25px;
      background: white;
      color: black;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="estado">Iniciando AluARTmx AR...</div>

  <button id="sonido">Activar sonido</button>

  <a-scene
    id="escena"
    embedded
    mindar-image="autoStart: false"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
      <video
        id="videoAR"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <!-- Plano vertical 9:16 desde el inicio -->
      <a-video
        id="videoPlano"
        src="#videoAR"
        position="0 0 0.01"
        width="0.84375"
        height="1.5"
        rotation="0 0 0"
        material="shader: flat; src: #videoAR; side: double"
        visible="true">
      </a-video>

    </a-entity>

  </a-scene>

  <script>
    const parametros = new URLSearchParams(location.search);

    const idSolicitado = parametros.get("id") || "001";

    function archivoSeguro(valor, defecto) {
      if (!valor) return defecto;

      if (!/^[a-zA-Z0-9_.-]+$/.test(valor)) {
        return defecto;
      }

      return valor;
    }

    const id = archivoSeguro(idSolicitado, "001");

    const nombreTarget = archivoSeguro(
      parametros.get("target"),
      id + ".mind"
    );

    const nombreVideo = archivoSeguro(
      parametros.get("video"),
      id + ".mp4"
    );

    const TARGET_URL = "./" + nombreTarget;
    const VIDEO_URL = "./" + nombreVideo;

    const escena = document.querySelector("#escena");
    const target = document.querySelector("#target");
    const video = document.querySelector("#videoAR");
    const plano = document.querySelector("#videoPlano");
    const estado = document.querySelector("#estado");
    const botonSonido = document.querySelector("#sonido");

    let visible = false;
    let videoPreparado = false;

    function mensaje(texto) {
      estado.textContent = texto;
      console.log("[AluARTmx]", texto);
    }

    // =========================================
    // ESTABILIZACION MINDAR
    // =========================================

    escena.setAttribute(
      "mindar-image",
      "imageTargetSrc: " + TARGET_URL + ";" +
      "autoStart: false;" +
      "filterMinCF: 0.0005;" +
      "filterBeta: 0.001;" +
      "warmupTolerance: 5;" +
      "missTolerance: 10"
    );

    // Cache busting del MP4 durante la prueba.
    // No modifica el archivo original.
    video.src = VIDEO_URL + "?arversion=31";

    // =========================================
    // GEOMETRIA VERTICAL
    // =========================================

    function establecerGeometria(ancho, alto) {
      plano.setAttribute(
        "geometry",
        "primitive: plane; width: " +
        ancho + "; height: " + alto
      );

      plano.setAttribute("width", ancho);
      plano.setAttribute("height", alto);

      console.log(
        "[AluARTmx] Geometria:",
        ancho,
        alto
      );
    }

    // Proporcion inicial vertical 9:16.
    establecerGeometria(0.84375, 1.5);

    function ajustarVideo() {
      if (!video.videoWidth || !video.videoHeight) {
        return;
      }

      const anchoOriginal = video.videoWidth;
      const altoOriginal = video.videoHeight;

      const proporcion =
        anchoOriginal / altoOriginal;

      // Dimensiones de referencia del cuadro 20 x 30.
      const anchoCuadro = 1;
      const altoCuadro = 1.5;

      // Escalado "cover" sin deformar.
      const escala = Math.max(
        anchoCuadro / anchoOriginal,
        altoCuadro / altoOriginal
      );

      const ancho = anchoOriginal * escala;
      const alto = altoOriginal * escala;

      establecerGeometria(ancho, alto);

      videoPreparado = true;

      console.log(
        "[AluARTmx] MP4:",
        anchoOriginal + "x" + altoOriginal
      );

      console.log(
        "[AluARTmx] Proporcion:",
        proporcion
      );

      if (anchoOriginal > altoOriginal) {
        mensaje("Aviso: el MP4 cargado es horizontal");
      } else {
        mensaje("Video vertical preparado. Apunta al cuadro");
      }
    }

    video.addEventListener(
      "loadedmetadata",
      ajustarVideo
    );

    // =========================================
    // REFRESCO DE TEXTURA
    // Mantiene la solucion de reproduccion.
    // =========================================

    function actualizarTextura() {
      const mesh = plano.getObject3D("mesh");

      if (!mesh) return;

      const materiales = Array.isArray(mesh.material)
        ? mesh.material
        : [mesh.material];

      for (const material of materiales) {
        if (material && material.map) {
          material.map.needsUpdate = true;
        }
      }
    }

    video.addEventListener(
      "timeupdate",
      actualizarTextura
    );

    function actualizarFrame() {
      actualizarTextura();

      if (
        typeof video.requestVideoFrameCallback === "function"
      ) {
        video.requestVideoFrameCallback(actualizarFrame);
      }
    }

    if (
      typeof video.requestVideoFrameCallback === "function"
    ) {
      video.requestVideoFrameCallback(actualizarFrame);
    }

    let ultimoTiempo = -1;

    function revisarVideo() {
      if (
        !video.paused &&
        video.currentTime !== ultimoTiempo
      ) {
        actualizarTextura();
        ultimoTiempo = video.currentTime;
      }

      requestAnimationFrame(revisarVideo);
    }

    requestAnimationFrame(revisarVideo);

    // =========================================
    // REPRODUCCION
    // =========================================

    async function reproducirVideo() {
      if (!visible) return;

      try {
        if (video.ended) {
          video.currentTime = 0;
        }

        await video.play();

        actualizarTextura();

        mensaje("Reproduciendo experiencia AR");
      } catch (error) {
        console.warn(
          "[AluARTmx] Reproduccion:",
          error
        );

        mensaje("Toca Activar sonido para reproducir");
      }
    }

    target.addEventListener(
      "targetFound",
      () => {
        visible = true;
        reproducirVideo();
      }
    );

    target.addEventListener(
      "targetLost",
      () => {
        visible = false;
        video.pause();
        mensaje("Apunta la camara al cuadro");
      }
    );

    botonSonido.addEventListener(
      "click",
      async () => {
        video.muted = false;

        try {
          if (visible) {
            await video.play();
          }

          botonSonido.textContent =
            "Sonido activado";
        } catch (error) {
          console.warn(
            "[AluARTmx] Sonido:",
            error
          );
        }
      }
    );

    video.addEventListener(
      "ended",
      () => {
        video.pause();
        mensaje("Video finalizado");
      }
    );

    // =========================================
    // INICIO DE CAMARA
    // =========================================

    escena.addEventListener(
      "loaded",
      async () => {
        try {
          mensaje("Iniciando camara...");

          const sistema =
            escena.systems["mindar-image-system"];

          await sistema.start();

          if (videoPreparado) {
            mensaje("Apunta la camara al cuadro");
          } else {
            mensaje("Preparando video...");
          }

        } catch (error) {
          console.error(
            "[AluARTmx] Camara:",
            error
          );

          mensaje("Error al iniciar la camara");
        }
      }
    );

    video.addEventListener(
      "error",
      () => {
        console.error(
          "[AluARTmx] Video:",
          video.error
        );

        mensaje("No se pudo cargar el video");
      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#ar-container {
    width: 100%;
    height: 100%;
}

#mensaje {
    position: fixed;
    top: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: white;
    z-index: 10;
    font-family: Arial;
}
</style>

</head>

<body>

<div id="mensaje">Iniciando AluARTmx AR...</div>

<div id="ar-container"></div>

<script>

async function iniciarAR() {

    try {

        const mindarThree = new MindARThree({
            container: document.querySelector("#ar-container"),
            imageTargetSrc: "./targets.mind"
        });

        const renderer = mindarThree.renderer;
        const scene = mindarThree.scene;
        const camera = mindarThree.camera;

        const video = document.createElement("video");

        video.src = "./10megas.mp4";
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute("webkit-playsinline", "true");

        const texture = new THREE.VideoTexture(video);

        const geometry = new THREE.PlaneGeometry(1, 0.5625);

        const material = new THREE.MeshBasicMaterial({
            map: texture
        });

        const plane = new THREE.Mesh(
            geometry,
            material
        );

        const anchor = mindarThree.addAnchor(0);

        anchor.group.add(plane);

        anchor.onTargetFound = () => {

            document.querySelector("#mensaje").innerText =
                "¡Cuadro detectado!";

            video.play();

        };

        anchor.onTargetLost = () => {

            document.querySelector("#mensaje").innerText =
                "Busca el cuadro...";

            video.pause();

        };

        await mindarThree.start();

        document.querySelector("#mensaje").innerText =
            "Apunta la cámara al cuadro";

        renderer.setAnimationLoop(() => {

            renderer.render(scene, camera);

        });

    } catch (error) {

        document.querySelector("#mensaje").innerHTML =
            "ERROR: " + error.message;

        console.error(error);

    }

}

iniciarAR();

</script>

</body>
</html>

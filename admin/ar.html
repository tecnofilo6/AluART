<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<style>

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

#container {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

#mensaje {
  position: fixed;
  top: 20px;
  left: 0;
  right: 0;
  text-align: center;
  color: white;
  font-family: Arial;
  z-index: 100;
}

</style>

</head>

<body>

<div id="mensaje">Iniciando AluARTmx AR...</div>

<div id="container"></div>

<script type="module">

import * as THREE from 'three';

import { MindARThree } from 'mindar-image-three';


const mensaje = document.querySelector("#mensaje");


const mindarThree = new MindARThree({

  container: document.querySelector("#container"),

  imageTargetSrc: "./targets.mind"

});


const { renderer, scene, camera } = mindarThree;


const video = document.createElement("video");

video.src = "./10megas.mp4";

video.loop = true;

video.muted = true;

video.playsInline = true;

video.setAttribute("webkit-playsinline", "true");


const texture = new THREE.VideoTexture(video);


const geometry = new THREE.PlaneGeometry(1, 0.5625);


const material = new THREE.MeshBasicMaterial({

  map: texture

});


const plane = new THREE.Mesh(

  geometry,

  material

);


const anchor = mindarThree.addAnchor(0);


anchor.group.add(plane);


anchor.onTargetFound = () => {

  mensaje.innerText = "¡CUADRO DETECTADO!";

  video.play();

};


anchor.onTargetLost = () => {

  mensaje.innerText = "Apunta al cuadro";

  video.pause();

};


const iniciar = async () => {

  try {

    await mindarThree.start();

    mensaje.innerText = "Apunta la cámara al cuadro";

    renderer.setAnimationLoop(() => {

      renderer.render(scene, camera);

    });

  } catch (error) {

    mensaje.innerText = "ERROR: " + error.message;

    console.error(error);

  }

};


iniciar();

</script>

</body>

</html>

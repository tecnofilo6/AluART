
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

#mensaje {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    text-align: center;
    max-width: 85%;
}

#botonSonido {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999999;
    background: white;
    color: black;
    border: 3px solid black;
    border-radius: 40px;
    padding: 16px 30px;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    cursor: pointer;
    white-space: nowrap;
}
</style>
</head>

<body>

<div id="mensaje">
    AluARTmx · Preparando experiencia...
</div>

<button id="botonSonido" type="button">
    🔊 ACTIVAR SONIDO
</button>

<script>
(async function() {

    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("botonSonido");

    try {

        // PARAMETROS DEL QR

        const parametros = new URLSearchParams(
            window.location.search
        );

        const id = parametros.get("id");
        const targetUrl = parametros.get("target");
        const videoUrl = parametros.get("video");

        if (!id || !targetUrl || !videoUrl) {
            mensaje.textContent =
                "❌ Esta experiencia AR no está configurada correctamente.";
            return;
        }

        mensaje.textContent =
            "AluARTmx · Cargando cuadro " + id + "...";

        // ESCENA MINDAR

        const escena = document.createElement("a-scene");

        escena.setAttribute(
            "mindar-image",
            "imageTargetSrc: " + targetUrl + ";"
        );

        escena.setAttribute(
            "vr-mode-ui",
            "enabled: false"
        );

        escena.setAttribute(
            "device-orientation-permission-ui",
            "enabled: false"
        );

        escena.setAttribute(
            "renderer",
            "colorManagement: true; physicallyCorrectLights: true"
        );

        // VIDEO

        const assets = document.createElement("a-assets");

        const video = document.createElement("video");

        video.id = "videoAR";
        video.src = videoUrl;
        video.preload = "auto";
        video.muted = true;
        video.defaultMuted = true;
        video.playsInline = true;

        video.setAttribute("muted", "");
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");

        video.crossOrigin = "anonymous";

        assets.appendChild(video);

        // CAMARA

        const camara = document.createElement("a-camera");

        camara.setAttribute("position", "0 0 0");
        camara.setAttribute(
            "look-controls",
            "enabled: false"
        );

        // TARGET

        const target = document.createElement("a-entity");

        target.setAttribute(
            "mindar-image-target",
            "targetIndex: 0"
        );

        // PLANO DEL VIDEO

        const videoPlano = document.createElement("a-video");

        videoPlano.id = "videoPlano";

        videoPlano.setAttribute("src", "#videoAR");
        videoPlano.setAttribute("position", "0 0 0");
        videoPlano.setAttribute("width", "1");
        videoPlano.setAttribute("height", "0.5625");
        videoPlano.setAttribute("rotation", "0 0 0");

        videoPlano.setAttribute(
            "material",
            "shader: flat; src: #videoAR; side: double;"
        );

        videoPlano.setAttribute("visible", "true");

        target.appendChild(videoPlano);

        escena.appendChild(assets);
        escena.appendChild(camara);
        escena.appendChild(target);

        document.body.appendChild(escena);

        // CONTROL DE REPRODUCCION

        let cuadroVisible = false;
        let reproduccionSolicitada = false;

        async function reproducirVideo() {

            if (reproduccionSolicitada) return;

            reproduccionSolicitada = true;

            try {
                await video.play();

                console.log(
                    "AluARTmx: reproducción iniciada"
                );

            } catch (error) {

                console.error(
                    "AluARTmx: error al reproducir",
                    error
                );

                mensaje.textContent =
                    "Toca ACTIVAR SONIDO para iniciar el video.";

            } finally {
                reproduccionSolicitada = false;
            }
        }

        // RECONOCIMIENTO DEL CUADRO

        target.addEventListener(
            "targetFound",
            function() {

                cuadroVisible = true;

                console.log(
                    "AluARTmx: CUADRO " + id + " DETECTADO"
                );

                mensaje.textContent =
                    "AluARTmx · Cuadro " + id + " detectado";

                reproducirVideo();
            }
        );

        target.addEventListener(
            "targetLost",
            function() {

                cuadroVisible = false;

                console.log(
                    "AluARTmx: CUADRO " + id + " PERDIDO"
                );

                video.pause();

                mensaje.textContent =
                    "Apunta la cámara hacia tu cuadro.";
            }
        );

        // BOTON DE SONIDO

        boton.addEventListener(
            "click",
            async function() {

                video.muted = false;
                video.volume = 1;

                try {

                    await video.play();

                    boton.textContent =
                        "🔊 SONIDO ACTIVADO";

                    console.log(
                        "AluARTmx: sonido activado"
                    );

                } catch (error) {

                    console.error(
                        "AluARTmx: error de audio",
                        error
                    );

                    mensaje.textContent =
                        "No se pudo iniciar el video.";
                }
            }
        );

        // ACTUALIZACION DE TEXTURA

        escena.addEventListener(
            "loaded",
            function() {

                console.log(
                    "AluARTmx: escena cargada"
                );

                const mesh =
                    videoPlano.getObject3D("mesh");

                if (!mesh || !mesh.material) {

                    console.warn(
                        "AluARTmx: material no disponible"
                    );

                    return;
                }

                const textura = mesh.material.map;

                if (!textura) {

                    console.warn(
                        "AluARTmx: textura no disponible"
                    );

                    return;
                }

                console.log(
                    "AluARTmx: textura de video detectada"
                );

                // Actualizar la textura cuando
                // el video tenga datos disponibles.

                video.addEventListener(
                    "timeupdate",
                    function() {

                        if (video.readyState >= 2) {
                            textura.needsUpdate = true;
                        }
                    }
                );

                // Actualizar en cada fotograma
                // cuando el navegador lo permita.

                if (typeof video.requestVideoFrameCallback === "function") {

                    function actualizarFotograma() {

                        if (
                            video.readyState >= 2 &&
                            !video.paused
                        ) {
                            textura.needsUpdate = true;
                        }

                        video.requestVideoFrameCallback(
                            actualizarFotograma
                        );
                    }

                    video.requestVideoFrameCallback(
                        actualizarFotograma
                    );
                }
            }
        );

        // DIAGNOSTICO DEL VIDEO

        video.addEventListener(
            "playing",
            function() {

                console.log(
                    "AluARTmx: video reproduciéndose"
                );
            }
        );

        video.addEventListener(
            "pause",
            function() {

                console.log(
                    "AluARTmx: video pausado"
                );
            }
        );

        video.addEventListener(
            "error",
            function() {

                console.error(
                    "AluARTmx: error de video",
                    video.error
                );

                mensaje.textContent =
                    "❌ Error al cargar el video.";
            }
        );

        video.addEventListener(
            "ended",
            function() {

                console.log(
                    "AluARTmx: video terminado"
                );

                video.pause();

                mensaje.textContent =
                    "AluARTmx · Video terminado";
            }
        );

        // INFORMACION DE DIAGNOSTICO

        setInterval(function() {

            if (cuadroVisible) {

                console.log(
                    "AluARTmx diagnóstico:",
                    {
                        tiempo: video.currentTime,
                        pausado: video.paused,
                        estado: video.readyState,
                        visible: cuadroVisible
                    }
                );
            }

        }, 5000);

    } catch (error) {

        console.error(
            "AluARTmx: error general",
            error
        );

        mensaje.textContent =
            "❌ Error al cargar la experiencia AR.";
    }

})();
</script>

</body>
</html>

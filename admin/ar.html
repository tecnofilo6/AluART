```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AluARTmx AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    #sonido {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      background: white;
      color: black;

      border: none;
      border-radius: 30px;

      padding: 14px 24px;

      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;

      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #sonido.oculto {
      display: none;
    }
  </style>
</head>

<body>

  <button id="sonido" class="oculto">
    🔊 ACTIVAR SONIDO
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>

      <video
        id="videoAR"
        src="./10megas.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline>
      </video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        src="#videoAR"
        position="0 0 0"
        width="1"
        height="0.5625">
      </a-video>

    </a-entity>

  </a-scene>

  <script>

    const video = document.getElementById("videoAR");
    const boton = document.getElementById("sonido");

    // Cuando MindAR encuentra el cuadro
    const target = document.querySelector("[mindar-image-target]");

    target.addEventListener("targetFound", function () {

      console.log("Cuadro encontrado");

      // Reproducir automáticamente sin sonido
      video.muted = true;

      video.play().then(function () {

        // Mostrar botón para activar sonido
        boton.classList.remove("oculto");

      }).catch(function(error) {

        console.log("Error reproduciendo video:", error);

      });

    });

    // Cuando se pierde el cuadro
    target.addEventListener("targetLost", function () {

      console.log("Cuadro perdido");

      video.pause();

    });

    // Activar sonido
    boton.addEventListener("click", function () {

      video.muted = false;
      video.volume = 1;

      video.play();

      boton.innerHTML = "🔇 SILENCIAR";

    });

  </script>

</body>
</html>
```


<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#mensaje {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  background: rgba(0,0,0,.75);
  color: white;
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 13px;
  text-align: center;
  max-width: 85%;
  transition: opacity .3s;
  pointer-events: none;
}

#botonSonido {
  position: fixed;
  bottom: 18px;
  right: 18px;
  z-index: 999999;
  width: 48px;
  height: 48px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.45);
  background: rgba(0,0,0,.65);
  color: white;
  font-size: 22px;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="mensaje">
  AluARTmx · Preparando experiencia...
</div>

<button id="botonSonido" type="button"
        aria-label="Activar sonido">🔇</button>

<script>
(async function() {

  const mensaje = document.getElementById("mensaje");
  const boton = document.getElementById("botonSonido");

  try {

    // PARAMETROS DEL QR
    const parametros = new URLSearchParams(
      window.location.search
    );

    const id = parametros.get("id");
    const targetUrl = parametros.get("target");
    const videoUrl = parametros.get("video");

    const orientacion =
      parametros.get("orientacion") === "vertical"
        ? "vertical"
        : parametros.get("orientacion") === "horizontal"
          ? "horizontal"
          : "original";

    if (!id || !targetUrl || !videoUrl) {
      mensaje.textContent =
        "Esta experiencia AR no está configurada.";
      return;
    }

    mensaje.textContent =
      "AluARTmx · Cargando cuadro " + id;

    // ESCENA MINDAR
    const escena = document.createElement("a-scene");

    escena.setAttribute(
      "mindar-image",
      "imageTargetSrc: " + targetUrl + ";"
    );

    escena.setAttribute(
      "vr-mode-ui",
      "enabled: false"
    );

    escena.setAttribute(
      "device-orientation-permission-ui",
      "enabled: false"
    );

    escena.setAttribute(
      "renderer",
      "colorManagement: true; physicallyCorrectLights: true"
    );

    // VIDEO
    const assets = document.createElement("a-assets");
    const video = document.createElement("video");

    video.id = "videoAR";
    video.src = videoUrl;
    video.preload = "auto";
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.crossOrigin = "anonymous";

    video.setAttribute("muted", "");
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");

    assets.appendChild(video);

    // CAMARA
    const camara = document.createElement("a-camera");

    camara.setAttribute("position", "0 0 0");
    camara.setAttribute(
      "look-controls",
      "enabled: false"
    );

    // TARGET
    const target = document.createElement("a-entity");

    target.setAttribute(
      "mindar-image-target",
      "targetIndex: 0"
    );

    // PLANO DEL VIDEO
    const videoPlano = document.createElement("a-video");

    videoPlano.id = "videoPlano";
    videoPlano.setAttribute("src", "#videoAR");
    videoPlano.setAttribute("position", "0 0 0");
    videoPlano.setAttribute("width", "1");
    videoPlano.setAttribute("height", "0.5625");
    videoPlano.setAttribute("rotation", "0 0 0");

    videoPlano.setAttribute(
      "material",
      "shader: flat; src: #videoAR; side: double;"
    );

    videoPlano.setAttribute("visible", "true");

    // AJUSTE DE ORIENTACION
    let texturaVideo = null;
    let anchoVideo = 0;
    let altoVideo = 0;

    function aplicarEncuadre() {

      // QR antiguos conservan sus medidas originales.
      if (orientacion === "original") return;

      const anchoCuadro = 1;
      const altoCuadro =
        orientacion === "vertical" ? 1.5 : 2 / 3;

      videoPlano.setAttribute("width", anchoCuadro);
      videoPlano.setAttribute("height", altoCuadro);

      videoPlano.setAttribute("geometry", {
        primitive: "plane",
        width: anchoCuadro,
        height: altoCuadro
      });

      if (!texturaVideo || !anchoVideo || !altoVideo) {
        return;
      }

      // Recorte central para cubrir el cuadro
      // sin deformar el video.
      const proporcionCuadro = anchoCuadro / altoCuadro;
      const proporcionVideo = anchoVideo / altoVideo;

      let rx = 1;
      let ry = 1;

      if (proporcionVideo > proporcionCuadro) {
        rx = proporcionCuadro / proporcionVideo;
      } else {
        ry = proporcionVideo / proporcionCuadro;
      }

      texturaVideo.repeat.set(rx, ry);
      texturaVideo.offset.set(
        (1 - rx) / 2,
        (1 - ry) / 2
      );

      texturaVideo.needsUpdate = true;
    }

    video.addEventListener("loadedmetadata", function() {
      anchoVideo = video.videoWidth;
      altoVideo = video.videoHeight;

      console.log(
        "AluARTmx dimensiones MP4:",
        anchoVideo,
        altoVideo
      );

      aplicarEncuadre();
    });

    aplicarEncuadre();

    target.appendChild(videoPlano);

    escena.appendChild(assets);
    escena.appendChild(camara);
    escena.appendChild(target);

    document.body.appendChild(escena);

    // AVISOS DISCRETOS
    let avisoTimer;

    const observador = new MutationObserver(function() {
      clearTimeout(avisoTimer);
      mensaje.style.opacity = "1";

      avisoTimer = setTimeout(function() {
        if (
          !mensaje.textContent.includes("Error") &&
          !mensaje.textContent.includes("Toca")
        ) {
          mensaje.style.opacity = "0";
        }
      }, 3000);
    });

    observador.observe(mensaje, {
      childList: true,
      characterData: true,
      subtree: true
    });

    // REPRODUCCION
    let cuadroVisible = false;
    let reproduccionSolicitada = false;

    async function reproducirVideo() {

      if (reproduccionSolicitada) return;

      reproduccionSolicitada = true;

      try {
        await video.play();
        console.log("AluARTmx: reproducción iniciada");
      } catch (error) {
        console.error(error);
        mensaje.textContent =
          "Toca el botón de sonido para reproducir.";
      } finally {
        reproduccionSolicitada = false;
      }
    }

    // RECONOCIMIENTO
    target.addEventListener("targetFound", function() {
      cuadroVisible = true;

      mensaje.textContent =
        "AluARTmx · Cuadro " + id + " detectado";

      reproducirVideo();
    });

    target.addEventListener("targetLost", function() {
      cuadroVisible = false;
      video.pause();

      mensaje.textContent =
        "Apunta la cámara hacia tu cuadro.";
    });

    // BOTON DE SONIDO
    boton.addEventListener("click", async function() {

      video.muted = !video.muted;
      video.volume = 1;

      boton.textContent = video.muted ? "🔇" : "🔊";

      boton.setAttribute(
        "aria-label",
        video.muted ? "Activar sonido" : "Silenciar sonido"
      );

      if (!video.muted && cuadroVisible) {
        try {
          await video.play();
        } catch (error) {
          console.error("Error de sonido:", error);
        }
      }
    });

    // ACTUALIZACION DE TEXTURA
    // Conservamos la solución que ya funcionaba.
    escena.addEventListener("loaded", function() {

      const mesh = videoPlano.getObject3D("mesh");

      if (!mesh || !mesh.material) {
        console.warn("Material no disponible");
        return;
      }

      const textura = mesh.material.map;
      texturaVideo = textura;

      aplicarEncuadre();

      if (!textura) {
        console.warn("Textura no disponible");
        return;
      }

      video.addEventListener("timeupdate", function() {
        if (video.readyState >= 2) {
          textura.needsUpdate = true;
        }
      });

      if (
        typeof video.requestVideoFrameCallback === "function"
      ) {

        function actualizarFotograma() {

          if (video.readyState >= 2 && !video.paused) {
            textura.needsUpdate = true;
          }

          video.requestVideoFrameCallback(
            actualizarFotograma
          );
        }

        video.requestVideoFrameCallback(
          actualizarFotograma
        );
      }
    });

    // ERRORES
    video.addEventListener("error", function() {
      console.error("Error de video:", video.error);
      mensaje.textContent =
        "Error al cargar el video.";
    });

    video.addEventListener("ended", function() {
      video.pause();
      mensaje.textContent =
        "AluARTmx · Video terminado";
    });

    // DIAGNOSTICO
    setInterval(function() {
      if (cuadroVisible) {
        console.log("AluARTmx diagnóstico:", {
          tiempo: video.currentTime,
          pausado: video.paused,
          estado: video.readyState,
          visible: cuadroVisible
        });
      }
    }, 5000);

  } catch (error) {
    console.error("Error general AluARTmx:", error);
    mensaje.textContent =
      "Error al cargar la experiencia AR.";
  }

})();
</script>

</body>
</html>

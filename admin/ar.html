```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
}

#mensaje {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;

    background: rgba(0,0,0,0.75);
    color: white;

    padding: 10px 18px;
    border-radius: 20px;

    font-family: Arial, sans-serif;
    font-size: 14px;

    text-align: center;
}

#botonSonido {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 999999;

    background: white;
    color: black;

    border: 3px solid black;
    border-radius: 40px;

    padding: 16px 30px;

    font-family: Arial, sans-serif;
    font-size: 18px;
    font-weight: bold;

    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
}
</style>

</head>

<body>

<div id="mensaje">
    AluARTmx · Preparando experiencia...
</div>

<button id="botonSonido">
    ▶️ REPRODUCIR VIDEO
</button>

<script>

(async function(){

    try {

        const parametros = new URLSearchParams(
            window.location.search
        );

        const id = parametros.get("id");
        const targetUrl = parametros.get("target");
        const videoUrl = parametros.get("video");

        if (!id || !targetUrl || !videoUrl) {

            document.getElementById("mensaje").innerHTML =
                "❌ Esta experiencia AR no está configurada correctamente.";

            return;
        }

        document.getElementById("mensaje").innerHTML =
            "AluARTmx · Cargando cuadro " + id + "...";

        /*
         * CREAMOS A-FRAME DESPUÉS DE CONOCER
         * EL TARGET Y EL VIDEO.
         */

        const escena = document.createElement("a-scene");

        escena.setAttribute(
            "mindar-image",
            "imageTargetSrc: " + targetUrl + ";"
        );

        escena.setAttribute(
            "vr-mode-ui",
            "enabled: false"
        );

        escena.setAttribute(
            "device-orientation-permission-ui",
            "enabled: false"
        );

        escena.setAttribute(
            "renderer",
            "colorManagement: true; physicallyCorrectLights: true"
        );

        /*
         * VIDEO
         */

        const assets = document.createElement("a-assets");

        const video = document.createElement("video");

        video.id = "videoAR";
        video.src = videoUrl;
        video.preload = "auto";
        video.muted = true;
        video.playsInline = true;

        video.setAttribute(
            "webkit-playsinline",
            ""
        );

        /*
         * IMPORTANTE:
         * Permitimos que el navegador prepare
         * el video antes de intentar reproducirlo.
         */

        video.load();

        assets.appendChild(video);

        /*
         * CÁMARA
         */

        const camara = document.createElement("a-camera");

        camara.setAttribute(
            "position",
            "0 0 0"
        );

        camara.setAttribute(
            "look-controls",
            "enabled: false"
        );

        /*
         * TARGET
         */

        const target = document.createElement("a-entity");

        target.setAttribute(
            "mindar-image-target",
            "targetIndex: 0"
        );

        /*
         * VIDEO SOBRE EL TARGET
         */

        const videoPlano = document.createElement("a-video");

        videoPlano.id = "videoPlano";

        videoPlano.setAttribute(
            "src",
            "#videoAR"
        );

        videoPlano.setAttribute(
            "position",
            "0 0 0"
        );

        videoPlano.setAttribute(
            "width",
            "1"
        );

        videoPlano.setAttribute(
            "height",
            "0.5625"
        );

        videoPlano.setAttribute(
            "rotation",
            "0 0 0"
        );

        /*
         * MUY IMPORTANTE:
         * evita que el video aparezca negro.
         */

        videoPlano.setAttribute(
            "material",
            "shader: flat;"
        );

        videoPlano.setAttribute(
            "visible",
            "true"
        );

        target.appendChild(videoPlano);

        escena.appendChild(assets);
        escena.appendChild(camara);
        escena.appendChild(target);

        document.body.appendChild(escena);

        /*
         * BOTÓN
         */

        const boton =
            document.getElementById("botonSonido");

        /*
         * FUNCIÓN PARA REPRODUCIR
         */

        async function reproducirVideo() {

            try {

                video.muted = true;

                await video.play();

                document.getElementById(
                    "mensaje"
                ).innerHTML =
                    "AluARTmx · Reproduciendo video";

                boton.innerHTML =
                    "🔊 ACTIVAR SONIDO";

                console.log(
                    "AluARTmx: VIDEO REPRODUCIENDO"
                );

                return true;

            } catch(error) {

                console.log(
                    "AluARTmx: PLAY BLOQUEADO",
                    error
                );

                document.getElementById(
                    "mensaje"
                ).innerHTML =
                    "▶️ Toca REPRODUCIR VIDEO";

                return false;
            }

        }

        /*
         * CUANDO SE DETECTA EL CUADRO
         */

        target.addEventListener(
            "targetFound",
            function(){

                console.log(
                    "AluARTmx: CUADRO " +
                    id +
                    " DETECTADO"
                );

                document.getElementById(
                    "mensaje"
                ).innerHTML =
                    "AluARTmx · Cuadro " +
                    id +
                    " detectado";

                /*
                 * Intento automático.
                 */

                reproducirVideo();

            }
        );

        /*
         * CUANDO SE PIERDE EL CUADRO
         */

        target.addEventListener(
            "targetLost",
            function(){

                console.log(
                    "AluARTmx: CUADRO " +
                    id +
                    " PERDIDO"
                );

                video.pause();

            }
        );

        /*
         * BOTÓN.
         *
         * Este click sí cuenta como interacción
         * directa del usuario para el navegador.
         */

        boton.addEventListener(
            "click",
            async function(){

                try {

                    video.muted = false;
                    video.volume = 1;

                    await video.play();

                    boton.innerHTML =
                        "🔊 SONIDO ACTIVADO";

                    document.getElementById(
                        "mensaje"
                    ).innerHTML =
                        "AluARTmx · Video reproduciendo";

                    console.log(
                        "AluARTmx: VIDEO INICIADO POR USUARIO"
                    );

                } catch(error) {

                    console.log(
                        "AluARTmx: ERROR AL REPRODUCIR",
                        error
                    );

                    /*
                     * Segundo intento:
                     * reproducimos primero sin sonido.
                     */

                    try {

                        video.muted = true;

                        await video.play();

                        boton.innerHTML =
                            "🔊 ACTIVAR SONIDO";

                    } catch(error2) {

                        console.log(
                            "AluARTmx: SEGUNDO INTENTO FALLÓ",
                            error2
                        );

                    }

                }

            }
        );

        /*
         * SI EL VIDEO TERMINA
         */

        video.addEventListener(
            "ended",
            function(){

                console.log(
                    "AluARTmx: VIDEO TERMINADO"
                );

                video.pause();

                boton.innerHTML =
                    "▶️ REPRODUCIR VIDEO";

            }
        );

        /*
         * CUANDO EL VIDEO YA ESTÁ LISTO
         */

        video.addEventListener(
            "canplay",
            function(){

                console.log(
                    "AluARTmx: VIDEO LISTO PARA REPRODUCIR"
                );

            }
        );

    } catch(error) {

        console.error(error);

        document.getElementById(
            "mensaje"
        ).innerHTML =
            "❌ Error al cargar la experiencia AR.";

    }

})();

</script>

</body>
</html>
```

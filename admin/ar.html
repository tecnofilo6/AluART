<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#mensaje {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    background: rgba(0,0,0,.75);
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    font-family: Arial, sans-serif;
    text-align: center;
}

#sonido {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    padding: 14px 22px;
    border: 0;
    border-radius: 30px;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="mensaje">
    📷 Apunta al cuadro...
</div>

<button id="sonido">
    🔊 ACTIVAR SONIDO
</button>

<script>

const parametros = new URLSearchParams(window.location.search);

const targetUrl = parametros.get("target");
const videoUrl = parametros.get("video");

if (!targetUrl || !videoUrl) {

    document.getElementById("mensaje").innerHTML =
        "❌ No se encontró el target o el video.";

} else {

    const escena = document.createElement("a-scene");

    escena.setAttribute(
        "mindar-image",
        "imageTargetSrc: " + targetUrl + ";"
    );

    escena.setAttribute(
        "vr-mode-ui",
        "enabled: false"
    );

    escena.setAttribute(
        "device-orientation-permission-ui",
        "enabled: false"
    );

    escena.setAttribute(
        "renderer",
        "colorManagement: true; physicallyCorrectLights: true"
    );

    const assets = document.createElement("a-assets");

    const video = document.createElement("video");

    video.id = "videoAR";
    video.src = videoUrl;
    video.setAttribute("preload", "auto");
    video.setAttribute("muted", "");
    video.muted = true;
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    video.crossOrigin = "anonymous";

    assets.appendChild(video);

    const entidad = document.createElement("a-entity");

    entidad.setAttribute(
        "mindar-image-target",
        "targetIndex: 0"
    );

    const videoPlano = document.createElement("a-video");

    videoPlano.setAttribute(
        "src",
        "#videoAR"
    );

    videoPlano.setAttribute(
        "position",
        "0 0 0"
    );

    videoPlano.setAttribute(
        "width",
        "1"
    );

    videoPlano.setAttribute(
        "height",
        "0.5625"
    );

    videoPlano.setAttribute(
        "material",
        "shader: flat;"
    );

    videoPlano.setAttribute(
        "visible",
        "true"
    );

    entidad.appendChild(videoPlano);

    escena.appendChild(assets);
    escena.appendChild(entidad);

    document.body.appendChild(escena);

    const mensaje =
        document.getElementById("mensaje");

    entidad.addEventListener(
        "targetFound",
        async () => {

            mensaje.innerHTML =
                "▶️ Reproduciendo...";

            video.currentTime = 0;

            video.muted = true;

            try {

                await video.play();

                console.log(
                    "Video reproduciendo correctamente"
                );

            } catch (error) {

                console.error(
                    "Error al reproducir:",
                    error
                );

                mensaje.innerHTML =
                    "▶️ Toca la pantalla para reproducir";

            }

        }
    );

    entidad.addEventListener(
        "targetLost",
        () => {

            video.pause();

        }
    );

    video.addEventListener(
        "ended",
        () => {

            video.pause();

            mensaje.innerHTML =
                "📷 Apunta nuevamente al cuadro...";

        }
    );

    document.getElementById("sonido").addEventListener(
        "click",
        async () => {

            try {

                video.muted = false;

                await video.play();

                mensaje.innerHTML =
                    "🔊 Sonido activado";

            } catch (error) {

                console.error(error);

            }

        }
    );

    /*
       Si el navegador bloquea el primer play,
       cualquier toque del usuario podrá iniciarlo.
    */

    document.addEventListener(
        "click",
        async () => {

            if (
                !video.paused &&
                !video.muted
            ) {
                return;
            }

            if (
                video.currentTime > 0 ||
                video.readyState >= 2
            ) {

                try {

                    await video.play();

                } catch (error) {

                    console.log(
                        "El navegador mantiene bloqueada la reproducción"
                    );

                }

            }

        },
        { once: false }
    );

}

</script>

</body>
</html>

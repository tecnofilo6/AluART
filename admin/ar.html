<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
}

#mensaje {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;

    background: rgba(0,0,0,0.75);
    color: white;

    padding: 10px 18px;
    border-radius: 20px;

    font-family: Arial, sans-serif;
    font-size: 14px;

    text-align: center;
}

#botonSonido {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 999999;

    background: white;
    color: black;

    border: 3px solid black;
    border-radius: 40px;

    padding: 16px 30px;

    font-family: Arial, sans-serif;
    font-size: 18px;
    font-weight: bold;

    box-shadow: 0 5px 20px rgba(0,0,0,0.6);
}
</style>

</head>

<body>

<div id="mensaje">
    AluARTmx · Preparando experiencia...
</div>

<button id="botonSonido">
    🔊 ACTIVAR SONIDO
</button>

<script>

(async function(){

    try {

        const parametros = new URLSearchParams(
            window.location.search
        );

        const id = parametros.get("id");
        const targetUrl = parametros.get("target");
        const videoUrl = parametros.get("video");

        if (!id || !targetUrl || !videoUrl) {

            document.getElementById("mensaje").innerHTML =
                "❌ Esta experiencia AR no está configurada correctamente.";

            return;
        }

        document.getElementById("mensaje").innerHTML =
            "AluARTmx · Cargando cuadro " + id + "...";

        /*
         * Creamos el HTML de A-Frame solamente DESPUÉS
         * de conocer el target y el video.
         *
         * Esto evita el problema que tuvimos anteriormente
         * al intentar cambiar MindAR después de iniciar.
         */

        const escena = document.createElement("a-scene");

        escena.setAttribute(
            "mindar-image",
            "imageTargetSrc: " + targetUrl + ";"
        );

        escena.setAttribute(
            "vr-mode-ui",
            "enabled: false"
        );

        escena.setAttribute(
            "device-orientation-permission-ui",
            "enabled: false"
        );

        escena.setAttribute(
            "renderer",
            "colorManagement: true; physicallyCorrectLights: true"
        );

        /*
         * VIDEO
         */

        const assets = document.createElement("a-assets");

        const video = document.createElement("video");

        video.id = "videoAR";
        video.src = videoUrl;
        video.preload = "auto";
        video.muted = true;
        video.playsInline = true;
        video.setAttribute("webkit-playsinline", "");

        assets.appendChild(video);

        /*
         * CÁMARA
         */

        const camara = document.createElement("a-camera");

        camara.setAttribute(
            "position",
            "0 0 0"
        );

        camara.setAttribute(
            "look-controls",
            "enabled: false"
        );

        /*
         * TARGET
         */

        const target = document.createElement("a-entity");

        target.setAttribute(
            "mindar-image-target",
            "targetIndex: 0"
        );

        /*
         * VIDEO SOBRE EL TARGET
         */

        const videoPlano = document.createElement("a-video");

        videoPlano.id = "videoPlano";

        videoPlano.setAttribute(
            "src",
            "#videoAR"
        );

        videoPlano.setAttribute(
            "position",
            "0 0 0"
        );

        videoPlano.setAttribute(
            "width",
            "1"
        );

        videoPlano.setAttribute(
            "height",
            "0.5625"
        );

        videoPlano.setAttribute(
            "rotation",
            "0 0 0"
        );

        /*
         * MUY IMPORTANTE:
         * esta propiedad solucionó el problema
         * que tuvimos con el video negro.
         */

        videoPlano.setAttribute(
            "material",
            "shader: flat;"
        );

        videoPlano.setAttribute(
            "visible",
            "true"
        );

        target.appendChild(videoPlano);

        escena.appendChild(assets);
        escena.appendChild(camara);
        escena.appendChild(target);

        document.body.appendChild(escena);

        /*
         * EVENTOS
         */

        const boton =
            document.getElementById("botonSonido");

        target.addEventListener(
            "targetFound",
            function(){

                console.log(
                    "AluARTmx: CUADRO " +
                    id +
                    " DETECTADO"
                );

                document.getElementById(
                    "mensaje"
                ).innerHTML =
                    "AluARTmx · Cuadro " +
                    id +
                    " detectado";

                video.play().catch(function(error){

                    console.log(
                        "Autoplay bloqueado:",
                        error
                    );

                });

            }
        );

        target.addEventListener(
            "targetLost",
            function(){

                console.log(
                    "AluARTmx: CUADRO " +
                    id +
                    " PERDIDO"
                );

                video.pause();

            }
        );

        boton.addEventListener(
            "click",
            function(){

                video.muted = false;
                video.volume = 1;

                video.play().catch(
                    function(error){

                        console.log(
                            "Error:",
                            error
                        );

                    }
                );

                boton.innerHTML =
                    "🔊 SONIDO ACTIVADO";

            }
        );

        video.addEventListener(
            "ended",
            function(){

                console.log(
                    "AluARTmx: VIDEO TERMINADO"
                );

                video.pause();

            }
        );

    } catch(error) {

        console.error(error);

        document.getElementById(
            "mensaje"
        ).innerHTML =
            "❌ Error al cargar la experiencia AR.";

    }

})();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#container {
    width: 100vw;
    height: 100vh;
}

#mensaje {
    position: fixed;
    top: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 20px;
    z-index: 100;
    padding: 10px;
}

</style>

</head>

<body>

<div id="mensaje">
    Cargando AluARTmx AR...
</div>

<div id="container"></div>


<script type="module">

import * as THREE from "three";

import { MindARThree } from "mindar-image-three";


const mensaje = document.getElementById("mensaje");


async function iniciarAR() {

    try {

        mensaje.innerText = "Cargando MindAR...";


        const mindarThree = new MindARThree({

            container: document.getElementById("container"),

            imageTargetSrc: "./targets.mind"

        });


        mensaje.innerText = "MindAR cargado. Preparando cámara...";


        const { renderer, scene, camera } = mindarThree;


        // VIDEO

        const video = document.createElement("video");

        video.src = "./10megas.mp4";

        video.loop = true;

        video.muted = true;

        video.playsInline = true;

        video.setAttribute(
            "webkit-playsinline",
            "true"
        );


        const texture = new THREE.VideoTexture(video);


        const geometry = new THREE.PlaneGeometry(
            1,
            0.5625
        );


        const material = new THREE.MeshBasicMaterial({

            map: texture

        });


        const plane = new THREE.Mesh(
            geometry,
            material
        );


        // TARGET

        const anchor = mindarThree.addAnchor(0);

        anchor.group.add(plane);


        anchor.onTargetFound = () => {

            mensaje.innerText =
                "¡CUADRO DETECTADO!";

            video.play();

        };


        anchor.onTargetLost = () => {

            mensaje.innerText =
                "Apunta al cuadro";

            video.pause();

        };


        // INICIAR AR

        mensaje.innerText =
            "Intentando iniciar cámara...";


        await mindarThree.start();


        mensaje.innerText =
            "CÁMARA INICIADA - APUNTA AL CUADRO";


        renderer.setAnimationLoop(() => {

            renderer.render(
                scene,
                camera
            );

        });


    }

    catch (error) {

        mensaje.innerText =
            "ERROR: " + error.message;

        console.error(error);

    }

}


iniciarAR();

</script>

</body>

</html>

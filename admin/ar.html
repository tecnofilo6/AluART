<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AluARTmx AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    #mensaje {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 20px;
      border-radius: 25px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      text-align: center;
    }

    #sonido {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: white;
      color: black;
      border: none;
      padding: 14px 25px;
      border-radius: 30px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #sonido.oculto {
      display: none;
    }
  </style>
</head>

<body>

  <div id="mensaje">
    AluARTmx · Apunta la cámara hacia tu cuadro
  </div>

  <button id="sonido" class="oculto">
    🔊 ACTIVAR SONIDO
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true">

    <a-assets>

      <video
        id="videoAR"
        src="./10megas.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline>
      </video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        src="#videoAR"
        position="0 0 0"
        width="1"
        height="0.5625"
        rotation="0 0 0"
        autoplay
        loop>
      </a-video>

    </a-entity>

  </a-scene>

  <script>

    const video = document.querySelector("#videoAR");
    const botonSonido = document.querySelector("#sonido");
    const mensaje = document.querySelector("#mensaje");

    // Intentar iniciar el video automáticamente
    video.addEventListener("loadeddata", function () {

      video.play().catch(function () {
        console.log("Reproducción automática bloqueada.");
      });

    });

    // Activar sonido cuando el usuario toca el botón
    botonSonido.addEventListener("click", function () {

      video.muted = false;
      video.volume = 1;

      video.play().then(function () {

        botonSonido.classList.add("oculto");
        mensaje.innerHTML = "🔊 Sonido activado";

        setTimeout(function () {
          mensaje.style.display = "none";
        }, 2000);

      }).catch(function (error) {

        console.log("No se pudo activar el sonido:", error);

      });

    });

    // Cuando el usuario toca la pantalla,
    // también intentamos activar el sonido

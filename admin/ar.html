```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AluARTmx AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    #mensaje {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
    }

    #botonSonido {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      background: white;
      color: black;
      border: none;
      border-radius: 30px;

      padding: 14px 25px;

      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;

      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>

<body>

  <div id="mensaje">
    AluARTmx · Apunta la cámara hacia tu cuadro
  </div>

  <button id="botonSonido">
    🔊 ACTIVAR SONIDO
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true">

    <a-assets>

      <video
        id="videoAR"
        src="./10megas.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline>
      </video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        src="#videoAR"
        position="0 0 0"
        width="1"
        height="0.5625"
        rotation="0 0 0"
        autoplay
        loop>
      </a-video>

    </a-entity>

  </a-scene>

  <script>

    const video = document.querySelector("#videoAR");
    const botonSonido = document.querySelector("#botonSonido");

    video.addEventListener("loadeddata", function () {

      video.play().catch(function () {
        console.log("El navegador bloqueó la reproducción automática.");
      });

    });

    botonSonido.addEventListener("click", function () {

      video.muted = false;

      botonSonido.innerHTML = "🔊 SONIDO ACTIVADO";

    });

  </script>

</body>
</html>
```

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<style>

body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: #222;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #008cff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #006dcc;
}

.verde {
    background: #00a65a;
}

.rojo {
    background: #d63031;
}

.cuadro {
    background: #333;
    padding: 18px;
    border-radius: 10px;
    margin-top: 15px;
}

.qr {
    background: white;
    padding: 15px;
    width: fit-content;
    margin: 20px auto;
    border-radius: 8px;
}

.url {
    background: #111;
    padding: 10px;
    margin-top: 6px;
    border-radius: 6px;
    word-break: break-all;
    font-size: 12px;
    color: #aaa;
}

.qr-url {
    background: #063b20;
    border: 1px solid #00c878;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
    word-break: break-all;
    font-size: 13px;
}

.info {
    color: #aaa;
    font-size: 13px;
    margin-top: 6px;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>


<body>


<div class="container">


<h1>AluARTmx AR</h1>


<div class="card">

<h2>Nuevo cuadro</h2>


<label>ID del cuadro</label>

<input
    id="idCuadro"
    type="text"
    placeholder="Ejemplo: 001"
>


<label>Nombre del cliente</label>

<input
    id="cliente"
    type="text"
    placeholder="Ejemplo: Juan Pérez"
>


<label>URL de la experiencia AR</label>

<input
    id="arUrl"
    type="url"
    placeholder="https://tecnofilo6.github.io/AluART/"
>

<div class="info">
Obligatoria para registrar el cuadro.
</div>


<label>Video (URL para la demo)</label>

<input
    id="videoUrl"
    type="url"
    placeholder="Pega aquí el enlace de Google Drive"
>

<div class="info">
Esta URL será utilizada por el código QR.
</div>


<button onclick="guardarCuadro()">
Guardar cuadro
</button>

</div>



<div class="card">

<h2>Mis cuadros</h2>

<div id="lista"></div>

</div>


</div>



<script>


/*
==================================================
MEMORIA NUEVA
==================================================

Esta versión NO utiliza los cuadros antiguos.

==================================================
*/

const STORAGE =
    "aluart_cuadros_v3";


let cuadros =
    JSON.parse(
        localStorage.getItem(STORAGE)
    ) || [];



/*
==================================================
GOOGLE DRIVE
==================================================
*/

function convertirGoogleDrive(url) {

    url = url.trim();


    const match =
        url.match(
            /drive\.google\.com\/file\/d\/([^\/]+)/
        );


    if (match) {

        const id = match[1];


        return (
            "https://drive.google.com/file/d/"
            + id
            + "/preview"
        );

    }


    return url;

}



/*
==================================================
GUARDAR CUADRO
==================================================
*/

function guardarCuadro() {


    const id =
        document
        .getElementById("idCuadro")
        .value
        .trim();


    const cliente =
        document
        .getElementById("cliente")
        .value
        .trim();


    const arUrl =
        document
        .getElementById("arUrl")
        .value
        .trim();


    const videoOriginal =
        document
        .getElementById("videoUrl")
        .value
        .trim();


    if (!id) {

        alert("Escribe el ID del cuadro.");

        return;

    }


    if (!cliente) {

        alert("Escribe el nombre del cliente.");

        return;

    }


    if (!arUrl) {

        alert(
            "La URL de la experiencia AR es obligatoria."
        );

        return;

    }


    if (!videoOriginal) {

        alert(
            "Escribe la URL del video."
        );

        return;

    }


    /*
    Convertimos Google Drive
    */

    const video =
        convertirGoogleDrive(
            videoOriginal
        );


    /*
    Creamos el cuadro
    */

    const cuadro = {

        id: id,

        cliente: cliente,

        arUrl: arUrl,

        video: video

    };


    cuadros.push(cuadro);


    /*
    Guardamos en memoria NUEVA
    */

    localStorage.setItem(
        STORAGE,
        JSON.stringify(cuadros)
    );


    /*
    Limpiar formulario
    */

    document.getElementById(
        "idCuadro"
    ).value = "";


    document.getElementById(
        "cliente"
    ).value = "";


    document.getElementById(
        "arUrl"
    ).value = "";


    document.getElementById(
        "videoUrl"
    ).value = "";


    mostrarCuadros();


    alert(
        "Cuadro guardado correctamente."
    );

}



/*
==================================================
MOSTRAR CUADROS
==================================================
*/

function mostrarCuadros() {


    const lista =
        document.getElementById("lista");


    lista.innerHTML = "";


    if (cuadros.length === 0) {

        lista.innerHTML =
            "<p>No hay cuadros registrados.</p>";

        return;

    }


    cuadros.forEach(
        function(cuadro, indice) {


            const div =
                document.createElement("div");


            div.className =
                "cuadro";


            div.innerHTML = `

                <strong>ID:</strong>
                ${cuadro.id}

                <br><br>

                <strong>Cliente:</strong>
                ${cuadro.cliente}

                <br><br>

                <strong>Experiencia AR:</strong>

                <div class="url">
                    ${cuadro.arUrl}
                </div>


                <br>


                <strong>VIDEO:</strong>

                <div class="url">
                    ${cuadro.video}
                </div>


                <div class="qr-url">

                    <strong>
                    ⚠️ EL QR ABRIRÁ ESTA URL:
                    </strong>

                    <br><br>

                    ${cuadro.video}

                </div>


                <div
                    id="qr-${indice}"
                    class="qr"
                ></div>


                <button
                    class="verde"
                    onclick="abrirVideo(${indice})"
                >
                    ABRIR VIDEO
                </button>


                <button
                    onclick="descargarQR(${indice})"
                >
                    DESCARGAR QR
                </button>


                <button
                    class="rojo"
                    onclick="eliminarCuadro(${indice})"
                >
                    ELIMINAR
                </button>

            `;


            lista.appendChild(div);


            crearQR(indice);

        }
    );

}



/*
==================================================
GENERAR QR
==================================================
*/

function crearQR(indice) {


    const cuadro =
        cuadros[indice];


    const contenedor =
        document.getElementById(
            "qr-" + indice
        );


    contenedor.innerHTML = "";


    /*
    ==============================================
    MUY IMPORTANTE

    EL QR SOLAMENTE UTILIZA:

    cuadro.video

    NUNCA:

    cuadro.arUrl
    ==============================================
    */


    const urlQR =
        cuadro.video;


    new QRCode(

        contenedor,

        {

            text: urlQR,

            width: 260,

            height: 260,

            correctLevel:
                QRCode.CorrectLevel.H

        }

    );

}



/*
==================================================
ABRIR VIDEO
==================================================
*/

function abrirVideo(indice) {


    const cuadro =
        cuadros[indice];


    window.open(
        cuadro.video,
        "_blank"
    );

}



/*
==================================================
DESCARGAR QR
==================================================
*/

function descargarQR(indice) {


    const contenedor =
        document.getElementById(
            "qr-" + indice
        );


    const imagen =
        contenedor.querySelector("img");


    if (!imagen) {

        alert(
            "No se encontró el QR."
        );

        return;

    }


    const enlace =
        document.createElement("a");


    enlace.href =
        imagen.src;


    enlace.download =
        "AluARTmx-" +
        cuadros[indice].id +
        ".png";


    enlace.click();

}



/*
==================================================
ELIMINAR
==================================================
*/

function eliminarCuadro(indice) {


    if (
        !confirm(
            "¿Eliminar este cuadro?"
        )
    ) {

        return;

    }


    cuadros.splice(
        indice,
        1
    );


    localStorage.setItem(
        STORAGE,
        JSON.stringify(cuadros)
    );


    mostrarCuadros();

}



/*
==================================================
INICIAR
==================================================
*/

mostrarCuadros();

</script>


</body>

</html>

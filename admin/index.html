<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx - Crear QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:0;
    padding:20px;
}

.contenedor{
    max-width:600px;
    margin:auto;
    background:#222;
    padding:25px;
    border-radius:15px;
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border-radius:8px;
    border:1px solid #555;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:0;
    border-radius:8px;
    background:#00c853;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#resultado{
    display:none;
    text-align:center;
    margin-top:30px;
}

#qr{
    background:white;
    padding:15px;
    display:inline-block;
    margin-top:15px;
}

.info{
    background:#333;
    padding:12px;
    margin-top:15px;
    border-radius:8px;
    word-break:break-all;
}

.exito{
    color:#00e676;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="contenedor">

<h1>AluARTmx</h1>

<h2>Crear cuadro + QR</h2>

<label>ID del cuadro</label>
<input id="campoID" type="text" placeholder="Ejemplo: 001">

<label>Nombre del cliente</label>
<input id="campoCliente" type="text" placeholder="Nombre del cliente">

<label>URL de la experiencia AR</label>
<input id="campoExperiencia" type="text"
placeholder="Puedes poner cualquier cosa aquí">

<label>VIDEO</label>
<input id="campoVideo" type="text"
placeholder="Pega aquí el enlace de Google Drive">

<button onclick="generarQR()">
CREAR QR
</button>

<div id="resultado">

<p class="exito">
QR CREADO CORRECTAMENTE
</p>

<p>
<strong>El QR contiene ÚNICAMENTE:</strong>
</p>

<div class="info" id="direccionQR"></div>

<div id="qr"></div>

<button onclick="abrirVideo()">
ABRIR VIDEO
</button>

</div>

</div>

<script>

let videoParaAbrir = "";

function convertirDrive(enlace){

    enlace = enlace.trim();

    let resultado = enlace.match(
        /drive\.google\.com\/file\/d\/([^\/]+)/
    );

    if(resultado){

        let idVideo = resultado[1];

        return "https://drive.google.com/file/d/"
        + idVideo
        + "/preview";

    }

    return enlace;
}


function generarQR(){

    /*
    IMPORTANTE:
    ESTOS SON LOS ÚNICOS DATOS QUE SE USAN
    PARA CREAR EL QR.
    */

    let video = document
        .getElementById("campoVideo")
        .value
        .trim();

    if(video === ""){

        alert("Pega primero el enlace del VIDEO.");

        return;
    }

    /*
    Convertimos Google Drive
    */

    videoParaAbrir = convertirDrive(video);


    /*
    MOSTRAMOS EXACTAMENTE
    LO QUE VA DENTRO DEL QR
    */

    document.getElementById("direccionQR").textContent =
        videoParaAbrir;


    /*
    Limpiamos QR anterior
    */

    document.getElementById("qr").innerHTML = "";


    /*
    CREAR QR
    */

    new QRCode(
        document.getElementById("qr"),
        {
            text: videoParaAbrir,
            width:260,
            height:260,
            correctLevel:QRCode.CorrectLevel.H
        }
    );


    /*
    Mostrar resultado
    */

    document.getElementById("resultado").style.display =
        "block";

}


function abrirVideo(){

    if(videoParaAbrir === ""){

        alert("Primero crea el QR.");

        return;
    }

    window.open(videoParaAbrir,"_blank");

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<style>

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
}

.contenedor {
    max-width: 650px;
    margin: auto;
}

h1 {
    text-align: center;
}

.panel {
    background: #222;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 0;
    border-radius: 8px;
    background: #008cff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #006dcc;
}

#qr {
    background: white;
    padding: 15px;
    width: fit-content;
    margin: 25px auto;
    border-radius: 8px;
}

.resultado {
    background: #063b20;
    border: 1px solid #00d878;
    padding: 15px;
    border-radius: 8px;
    word-break: break-all;
    margin-top: 15px;
}

.negro {
    background: #111;
    padding: 12px;
    border-radius: 8px;
    word-break: break-all;
    font-size: 12px;
    color: #aaa;
}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>


<body>


<div class="contenedor">


<h1>AluARTmx AR</h1>


<div class="panel">


<h2>Crear cuadro</h2>


<label>
ID del cuadro
</label>

<input
    id="id"
    type="text"
    placeholder="001"
>


<label>
Nombre del cliente
</label>

<input
    id="cliente"
    type="text"
    placeholder="Prueba"
>


<label>
URL de la experiencia AR
</label>

<input
    id="experiencia"
    type="url"
    placeholder="https://tecnofilo6.github.io/AluART/"
>


<label>
Video (URL para la demo)
</label>

<input
    id="video"
    type="url"
    placeholder="Pega aquí el enlace de Google Drive"
>


<button
    onclick="crearQR()"
>
CREAR QR
</button>


</div>



<div
    class="panel"
    id="resultado"
    style="display:none;"
>


<h2>QR generado</h2>


<div>

<strong>
El QR contiene EXCLUSIVAMENTE:
</strong>

</div>


<div
    id="urlQR"
    class="resultado"
></div>


<div id="qr"></div>


<button
    onclick="abrirVideo()"
>
ABRIR VIDEO
</button>


</div>


</div>



<script>


let videoFinal = "";



function convertirDrive(url) {

    url = url.trim();


    const encontrado =
        url.match(
            /drive\.google\.com\/file\/d\/([^\/]+)/
        );


    if (encontrado) {

        const id =
            encontrado[1];


        return (
            "https://drive.google.com/file/d/"
            + id
            + "/preview"
        );

    }


    return url;

}



function crearQR() {


    const id =
        document
        .getElementById("id")
        .value
        .trim();


    const cliente =
        document
        .getElementById("cliente")
        .value
        .trim();


    const experiencia =
        document
        .getElementById("experiencia")
        .value
        .trim();


    const video =
        document
        .getElementById("video")
        .value
        .trim();


    if (!id) {

        alert(
            "Escribe el ID del cuadro."
        );

        return;

    }


    if (!cliente) {

        alert(
            "Escribe el nombre del cliente."
        );

        return;

    }


    if (!experiencia) {

        alert(
            "Escribe la URL de la experiencia AR."
        );

        return;

    }


    if (!video) {

        alert(
            "Escribe la URL del video."
        );

        return;

    }


    /*
    ============================================
    AQUÍ ESTÁ LA CLAVE

    EXPERIENCIA AR NO SE UTILIZA.

    SOLAMENTE UTILIZAMOS VIDEO.
    ============================================
    */


    videoFinal =
        convertirDrive(video);


    document.getElementById(
        "urlQR"
    ).textContent =
        videoFinal;


    document.getElementById(
        "qr"
    ).innerHTML = "";


    new QRCode(

        document.getElementById("qr"),

        {

            text: videoFinal,

            width: 260,

            height: 260,

            correctLevel:
                QRCode.CorrectLevel.H

        }

    );


    document.getElementById(
        "resultado"
    ).style.display =
        "block";

}



function abrirVideo() {

    if (!videoFinal) {

        alert(
            "Primero crea el QR."
        );

        return;

    }


    window.open(
        videoFinal,
        "_blank"
    );

}


</script>


</body>
</html>

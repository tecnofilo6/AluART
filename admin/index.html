<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AluARTmx AR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #111;

    color: white;
}

header {

    background: #000;

    padding: 25px;

    text-align: center;

    border-bottom:
        1px solid #333;
}

header h1 {

    margin: 0;

    font-size: 30px;
}

header p {

    color: #aaa;

    margin-top: 8px;
}

.container {

    width: 100%;

    max-width: 750px;

    margin: auto;

    padding: 25px 15px;
}

.card {

    background: #1c1c1c;

    border-radius: 15px;

    padding: 25px;

    margin-bottom: 20px;
}

h2 {

    margin-top: 0;
}

label {

    display: block;

    margin-top: 15px;

    margin-bottom: 5px;

    color: #ccc;
}

input {

    width: 100%;

    padding: 14px;

    border-radius: 8px;

    border:
        1px solid #444;

    background: #111;

    color: white;

    font-size: 16px;
}

button {

    padding: 13px 20px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-size: 15px;

    margin-top: 15px;

    margin-right: 5px;
}

.btn-primary {

    background: white;

    color: black;
}

.btn-secondary {

    background: #333;

    color: white;
}

.btn-danger {

    background: #8b2222;

    color: white;
}

.cuadro {

    background: #252525;

    padding: 18px;

    border-radius: 10px;

    margin-top: 15px;
}

.cuadro-title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 8px;
}

.url {

    color: #888;

    font-size: 12px;

    word-break: break-all;

    margin-top: 8px;
}

#qrModal {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.85);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 9999;
}

.qr-box {

    background: white;

    color: black;

    padding: 25px;

    border-radius: 15px;

    text-align: center;

    width: 90%;

    max-width: 400px;
}

#qrcode {

    margin: 20px auto;

    display: flex;

    justify-content: center;
}

.qr-url {

    font-size: 11px;

    word-break: break-all;

    color: #555;

    margin-top: 10px;
}

.empty {

    color: #777;

    text-align: center;

    padding: 20px;
}

</style>

</head>


<body>


<header>

<h1>AluARTmx AR</h1>

<p>
Sistema de cuadros con realidad aumentada
</p>

</header>



<div class="container">


<!-- NUEVO CUADRO -->

<div class="card">

<h2>Nuevo cuadro</h2>


<label>
ID del cuadro
</label>

<input
    id="idCuadro"
    type="text"
    placeholder="Ejemplo: 001"
>


<label>
Nombre del cliente
</label>

<input
    id="nombreCliente"
    type="text"
    placeholder="Ejemplo: Juan Pérez"
>


<label>
URL de la experiencia AR
</label>

<input
    id="urlAR"
    type="url"
    placeholder="Opcional"
>


<label>
Video URL
</label>

<input
    id="videoURL"
    type="url"
    placeholder="Pega aquí el enlace de Google Drive"
>


<button
    class="btn-primary"
    onclick="guardarCuadro()"
>
Guardar cuadro
</button>


</div>



<!-- MIS CUADROS -->

<div class="card">

<h2>
Mis cuadros
</h2>

<div id="listaCuadros">

</div>

</div>


</div>



<!-- MODAL QR -->

<div id="qrModal">

<div class="qr-box">

<h2>
QR del cuadro
</h2>


<div id="qrcode">
</div>


<div
    id="qrUrl"
    class="qr-url">
</div>


<button
    class="btn-primary"
    onclick="descargarQR()"
>
Descargar
</button>


<button
    class="btn-secondary"
    onclick="cerrarQR()"
>
Cerrar
</button>


</div>

</div>



<script>


/*
==================================================
VARIABLES
==================================================
*/


let cuadros = [];

let cuadroQR = null;


/*
==================================================
CARGAR CUADROS
==================================================
*/

function cargarCuadros() {

    const datos =
        localStorage.getItem(
            "aluartmx_cuadros"
        );

    if (datos) {

        try {

            cuadros =
                JSON.parse(datos);

        } catch {

            cuadros = [];

        }

    }

    mostrarCuadros();

}



/*
==================================================
GUARDAR DATOS
==================================================
*/

function guardarDatos() {

    localStorage.setItem(

        "aluartmx_cuadros",

        JSON.stringify(cuadros)

    );

}



/*
==================================================
CONVERTIR GOOGLE DRIVE
==================================================
*/

function convertirGoogleDrive(url) {


    if (!url) {

        return "";

    }


    /*
    Detecta enlaces:

    drive.google.com/file/d/ID/view
    */


    const resultado =

        url.match(
            /drive\.google\.com\/file\/d\/([^\/]+)/
        );


    if (resultado) {

        const id =
            resultado[1];


        return (

            "https://drive.google.com/file/d/" +

            id +

            "/preview"

        );

    }


    /*
    Si no es Google Drive,
    devuelve el enlace original.
    */


    return url;

}



/*
==================================================
GUARDAR CUADRO
==================================================
*/

function guardarCuadro() {


    const id =

        document
        .getElementById("idCuadro")
        .value
        .trim();


    const cliente =

        document
        .getElementById("nombreCliente")
        .value
        .trim();


    const ar =

        document
        .getElementById("urlAR")
        .value
        .trim();


    const video =

        document
        .getElementById("videoURL")
        .value
        .trim();


    if (!id) {

        alert(
            "Escribe el ID del cuadro."
        );

        return;

    }


    if (!cliente) {

        alert(
            "Escribe el nombre del cliente."
        );

        return;

    }


    if (!video) {

        alert(
            "Pega la URL del video."
        );

        return;

    }


    /*
    Convertimos automáticamente
    el enlace de Google Drive.
    */


    const videoFinal =

        convertirGoogleDrive(video);


    const cuadro = {

        id: id,

        cliente: cliente,

        ar: ar,

        video: videoFinal

    };


    /*
    Si ya existe el ID,
    lo actualizamos.
    */


    const posicion =

        cuadros.findIndex(
            c => c.id === id
        );


    if (posicion >= 0) {

        cuadros[posicion] =
            cuadro;

    } else {

        cuadros.push(
            cuadro
        );

    }


    guardarDatos();


    /*
    Limpiar formulario
    */


    document
    .getElementById("idCuadro")
    .value = "";


    document
    .getElementById("nombreCliente")
    .value = "";


    document
    .getElementById("urlAR")
    .value = "";


    document
    .getElementById("videoURL")
    .value = "";


    mostrarCuadros();


    alert(
        "Cuadro guardado correctamente."
    );

}



/*
==================================================
MOSTRAR CUADROS
==================================================
*/

function mostrarCuadros() {


    const lista =

        document
        .getElementById("listaCuadros");


    lista.innerHTML = "";


    if (cuadros.length === 0) {

        lista.innerHTML =

            '<div class="empty">' +

            'Todavía no tienes cuadros.' +

            '</div>';

        return;

    }


    cuadros.forEach(

        (cuadro, indice) => {


            const div =
                document.createElement("div");


            div.className =
                "cuadro";


            div.innerHTML =

                '<div class="cuadro-title">' +

                'Cuadro ' +

                escapeHTML(
                    cuadro.id
                ) +

                ' — ' +

                escapeHTML(
                    cuadro.cliente
                ) +

                '</div>' +


                '<div class="url">' +

                escapeHTML(
                    cuadro.video
                ) +

                '</div>' +


                '<button ' +

                'class="btn-primary" ' +

                'onclick="crearQR(' +

                indice +

                ')">' +

                'Generar QR' +

                '</button>' +


                '<button ' +

                'class="btn-secondary" ' +

                'onclick="abrirVideo(' +

                indice +

                ')">' +

                'Abrir video' +

                '</button>' +


                '<button ' +

                'class="btn-danger" ' +

                'onclick="eliminarCuadro(' +

                indice +

                ')">' +

                'Eliminar' +

                '</button>';


            lista.appendChild(
                div
            );

        }

    );

}



/*
==================================================
CREAR QR
==================================================
*/

function crearQR(indice) {


    const cuadro =
        cuadros[indice];


    if (!cuadro) {

        alert(
            "Cuadro no encontrado."
        );

        return;

    }


    cuadroQR =
        cuadro;


    const url =
        cuadro.video;


    /*
    Limpiar QR anterior
    */


    document
    .getElementById("qrcode")
    .innerHTML = "";


    /*
    Crear nuevo QR
    */


    new QRCode(

        document
        .getElementById("qrcode"),

        {

            text: url,

            width: 260,

            height: 260,

            correctLevel:
                QRCode.CorrectLevel.H

        }

    );


    /*
    Mostrar dirección
    */


    document
    .getElementById("qrUrl")
    .textContent =
        url;


    /*
    Mostrar ventana
    */


    document
    .getElementById("qrModal")
    .style.display =
        "flex";

}



/*
==================================================
DESCARGAR QR
==================================================
*/

function descargarQR() {


    if (!cuadroQR) {

        return;

    }


    /*
    Esperar a que QRCode
    genere la imagen
    */


    setTimeout(

        function() {


            const imagen =

                document
                .querySelector(
                    "#qrcode img"
                );


            if (!imagen) {

                alert(
                    "No se pudo generar la imagen QR."
                );

                return;

            }


            const enlace =
                document.createElement("a");


            enlace.href =
                imagen.src;


            enlace.download =

                "AluARTmx-QR-" +

                cuadroQR.id +

                ".png";


            enlace.click();


        },

        300

    );

}



/*
==================================================
ABRIR VIDEO
==================================================
*/

function abrirVideo(indice) {


    const cuadro =
        cuadros[indice];


    if (!cuadro) {

        return;

    }


    window.open(

        cuadro.video,

        "_blank"

    );

}



/*
==================================================
ELIMINAR
==================================================
*/

function eliminarCuadro(indice) {


    const cuadro =
        cuadros[indice];


    if (!cuadro) {

        return;

    }


    const confirmar =

        confirm(

            "¿Quieres eliminar el cuadro " +

            cuadro.id +

            "?"

        );


    if (!confirmar) {

        return;

    }


    cuadros.splice(
        indice,
        1
    );


    guardarDatos();


    mostrarCuadros();

}



/*
==================================================
CERRAR QR
==================================================
*/

function cerrarQR() {


    document
    .getElementById("qrModal")
    .style.display =
        "none";



    cuadroQR = null;

}



/*
==================================================
SEGURIDAD
==================================================
*/

function escapeHTML(text) {


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/*
==================================================
INICIAR
==================================================
*/

cargarCuadros();


</script>


</body>

</html>

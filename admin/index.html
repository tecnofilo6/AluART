<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AluARTmx AR</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: #222;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-bottom: 5px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #00aaff;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0088cc;
}

.cuadro {
    background: #333;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}

.qr {
    background: white;
    padding: 15px;
    display: inline-block;
    margin-top: 15px;
}

.url {
    word-break: break-all;
    font-size: 12px;
    color: #aaa;
    margin-top: 10px;
}

hr {
    border: 0;
    border-top: 1px solid #444;
    margin: 25px 0;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<div class="container">

<h1>AluARTmx AR</h1>

<div class="card">

<h2>Nuevo cuadro</h2>

<label>ID del cuadro</label>
<input id="idCuadro" placeholder="Ejemplo: 001">

<label>Nombre del cliente</label>
<input id="cliente" placeholder="Ejemplo: Juan Pérez">

<label>URL de la experiencia AR</label>
<input id="arUrl" placeholder="Opcional">

<label>Video (URL para la demo)</label>
<input id="videoUrl" placeholder="Pega aquí el enlace de Google Drive">

<button onclick="guardarCuadro()">
Guardar cuadro
</button>

</div>

<div class="card">

<h2>Mis cuadros</h2>

<div id="lista"></div>

</div>

</div>

<script>

let cuadros = JSON.parse(localStorage.getItem("aluart_cuadros")) || [];


/* ================================
   CONVERTIR GOOGLE DRIVE
================================ */

function convertirGoogleDrive(url) {

    if (!url) return "";

    url = url.trim();

    /*
    Detecta enlaces como:

    https://drive.google.com/file/d/ID/view
    https://drive.google.com/file/d/ID/view?usp=sharing
    */

    const match = url.match(
        /drive\.google\.com\/file\/d\/([^\/]+)/
    );

    if (match) {

        const id = match[1];

        return "https://drive.google.com/file/d/" 
             + id 
             + "/preview";
    }

    /*
    Si no es Google Drive,
    deja la URL tal como está.
    */

    return url;
}


/* ================================
   GUARDAR CUADRO
================================ */

function guardarCuadro() {

    const id = document.getElementById("idCuadro").value.trim();
    const cliente = document.getElementById("cliente").value.trim();

    /*
    IMPORTANTE:
    EL VIDEO SE TOMA DE videoUrl
    */

    const videoOriginal =
        document.getElementById("videoUrl").value.trim();

    const arUrl =
        document.getElementById("arUrl").value.trim();


    if (!id) {
        alert("Escribe el ID del cuadro");
        return;
    }

    if (!videoOriginal) {
        alert("Escribe la URL del video");
        return;
    }


    /*
    Convertimos el video de Google Drive
    */

    const video = convertirGoogleDrive(videoOriginal);


    const cuadro = {

        id: id,

        cliente: cliente,

        arUrl: arUrl,

        video: video

    };


    cuadros.push(cuadro);

    localStorage.setItem(
        "aluart_cuadros",
        JSON.stringify(cuadros)
    );


    document.getElementById("idCuadro").value = "";
    document.getElementById("cliente").value = "";
    document.getElementById("arUrl").value = "";
    document.getElementById("videoUrl").value = "";


    mostrarCuadros();

    alert("Cuadro guardado correctamente");
}


/* ================================
   MOSTRAR CUADROS
================================ */

function mostrarCuadros() {

    const lista = document.getElementById("lista");

    lista.innerHTML = "";


    if (cuadros.length === 0) {

        lista.innerHTML =
            "<p>No hay cuadros registrados.</p>";

        return;
    }


    cuadros.forEach((cuadro, indice) => {

        const div = document.createElement("div");

        div.className = "cuadro";


        div.innerHTML = `

            <strong>ID:</strong> ${cuadro.id}<br>

            <strong>Cliente:</strong>
            ${cuadro.cliente || "Sin nombre"}

            <br><br>

            <strong>Video:</strong>

            <div class="url">
                ${cuadro.video}
            </div>

            <div id="qr-${indice}" class="qr"></div>

            <button onclick="abrirVideo(${indice})">
                Abrir video
            </button>

            <button onclick="descargarQR(${indice})">
                Descargar QR
            </button>

            <button onclick="eliminarCuadro(${indice})">
                Eliminar
            </button>

        `;


        lista.appendChild(div);


        crearQR(indice);

    });

}


/* ================================
   CREAR QR
================================ */

function crearQR(indice) {

    const cuadro = cuadros[indice];

    const contenedor =
        document.getElementById("qr-" + indice);


    contenedor.innerHTML = "";


    /*
    MUY IMPORTANTE:

    EL QR USA DIRECTAMENTE
    LA URL GUARDADA EN "video"

    NO usa arUrl.
    NO usa ?id=001.
    */

    const url = cuadro.video;


    new QRCode(contenedor, {

        text: url,

        width: 260,

        height: 260,

        correctLevel: QRCode.CorrectLevel.H

    });

}


/* ================================
   ABRIR VIDEO
================================ */

function abrirVideo(indice) {

    const cuadro = cuadros[indice];

    window.open(
        cuadro.video,
        "_blank"
    );

}


/* ================================
   DESCARGAR QR
================================ */

function descargarQR(indice) {

    const contenedor =
        document.getElementById("qr-" + indice);

    const imagen =
        contenedor.querySelector("img");


    if (!imagen) {

        alert("No se encontró el QR");

        return;
    }


    const enlace =
        document.createElement("a");

    enlace.href = imagen.src;

    enlace.download =
        "AluARTmx-" +
        cuadros[indice].id +
        ".png";


    enlace.click();

}


/* ================================
   ELIMINAR
================================ */

function eliminarCuadro(indice) {

    if (
        !confirm(
            "¿Eliminar este cuadro?"
        )
    ) {

        return;
    }


    cuadros.splice(indice, 1);


    localStorage.setItem(
        "aluart_cuadros",
        JSON.stringify(cuadros)
    );


    mostrarCuadros();

}


/* ================================
   INICIAR
================================ */

mostrarCuadros();

</script>

</body>
</html>

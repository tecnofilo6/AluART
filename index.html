<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AluARTmx · Panel AR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    background:#000;
    padding:22px;
    text-align:center;
    border-bottom:1px solid #333;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:7px 0 0;
    color:#aaa;
}

.contenedor{
    max-width:900px;
    margin:auto;
    padding:25px 18px 50px;
}

.card{
    background:#1d1d1d;
    border:1px solid #333;
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
}

.card h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:16px;
    margin-bottom:7px;
    font-weight:bold;
}

input[type="text"],
input[type="file"]{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #555;
    background:#111;
    color:#fff;
    font-size:15px;
}

input[type="text"]:focus{
    outline:none;
    border-color:#fff;
}

input[type="file"]{
    padding:10px;
}

button{
    border:0;
    border-radius:10px;
    padding:14px 20px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btnCrear{
    width:100%;
    margin-top:22px;
    background:#fff;
    color:#111;
}

.btnCrear:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.estado{
    margin-top:18px;
    padding:15px;
    background:#000;
    border-radius:10px;
    white-space:pre-wrap;
    line-height:1.5;
}

.proyecto{
    background:#151515;
    border:1px solid #333;
    border-radius:14px;
    padding:18px;
    margin-top:15px;
}

.proyecto h3{
    margin-top:0;
}

.info{
    color:#aaa;
    font-size:14px;
    word-break:break-all;
    line-height:1.5;
}

.botones{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.btn{
    background:#fff;
    color:#111;
}

.btnSec{
    background:#333;
    color:#fff;
}

.btnDanger{
    background:#8b0000;
    color:#fff;
}

.qr{
    margin-top:18px;
    background:#fff;
    padding:15px;
    display:inline-block;
    border-radius:10px;
}

hr{
    border:0;
    border-top:1px solid #333;
    margin:25px 0;
}

small{
    color:#888;
}

#sinProyectos{
    color:#888;
    text-align:center;
    padding:20px;
}

</style>

</head>

<body>

<header>

<h1>AluARTmx</h1>

<p>Panel de experiencias de realidad aumentada</p>

</header>


<div class="contenedor">


<div class="card">

<h2>➕ Crear nuevo cuadro</h2>

<label>ID del cuadro</label>

<input
    type="text"
    id="id"
    readonly
>


<label>Nombre / cliente</label>

<input
    type="text"
    id="nombre"
    placeholder="Ej. Juan Pérez"
>


<label>📷 Target AR (.mind)</label>

<input
    type="file"
    id="archivoMind"
    accept=".mind,application/octet-stream"
>

<small>
Por ahora selecciona el archivo .mind generado por MindAR.
</small>


<label>🎬 Video</label>

<input
    type="file"
    id="archivoVideo"
    accept="video/*"
>

<small>
El video debe pesar menos de 50 MB.
</small>


button id="crear" class="btnCrear">
    🚀 SUBIR ARCHIVOS Y CREAR CUADRO
</button>


<div
    id="estado"
    class="estado"
>
Esperando archivos...
</div>

</div>


<div class="card">

<h2>📦 Mis cuadros</h2>

<div id="lista"></div>

</div>


</div>


<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://fqqtztgqlijlxyesbaqz.supabase.co';

const SUPABASE_KEY =
'sb_publishable_ehoCG0dQDrMlAG6j7UpyZA_gLiChk-9';

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const STORAGE_BUCKET = 'AluART';


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const AR_BASE =
'https://tecnofilo6.github.io/AluART/admin/ar.html';

const STORAGE_KEY =
'aluartmx_projects_v3';


/* =========================================================
   ELEMENTOS
========================================================= */

const inputId =
document.getElementById('id');

const inputNombre =
document.getElementById('nombre');

const inputMind =
document.getElementById('archivoMind');

const inputVideo =
document.getElementById('archivoVideo');

const botonCrear =
document.getElementById('crear');

const estado =
document.getElementById('estado');

const lista =
document.getElementById('lista');


/* =========================================================
   PROYECTOS
========================================================= */

function obtenerProyectos(){

    try{

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || [];

    }catch(error){

        return [];

    }

}


function guardarProyectos(proyectos){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(proyectos)
    );

}


/* =========================================================
   GENERAR ID
========================================================= */

function generarSiguienteId(){

    const proyectos =
    obtenerProyectos();

    let numeroMayor = 0;

    proyectos.forEach(function(p){

        const numero =
        parseInt(p.id,10);

        if(!isNaN(numero) &&
           numero > numeroMayor){

            numeroMayor = numero;

        }

    });

    return String(
        numeroMayor + 1
    ).padStart(3,'0');

}


/* =========================================================
   MOSTRAR SIGUIENTE ID
========================================================= */

function prepararNuevoId(){

    inputId.value =
    generarSiguienteId();

}

prepararNuevoId();


/* =========================================================
   ESTADO
========================================================= */

function mostrarEstado(texto){

    estado.textContent =
    texto;

}


/* =========================================================
   SUBIR ARCHIVO
========================================================= */

async function subirArchivo(
    archivo,
    ruta
){

    const resultado =
    await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
            ruta,
            archivo,
            {
                cacheControl:'3600',
                upsert:true
            }
        );

    if(resultado.error){

        throw resultado.error;

    }

    const publicData =
    supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(ruta);

    return publicData.data.publicUrl;

}


/* =========================================================
   EXTENSIÓN DEL VIDEO
========================================================= */

function obtenerExtensionVideo(nombre){

    const partes =
    nombre.split('.');

    if(partes.length < 2){

        return 'mp4';

    }

    return partes
        .pop()
        .toLowerCase()
        .replace(/[^a-z0-9]/g,'');

}


/* =========================================================
   CREAR QR
========================================================= */

function crearQR(contenedor,url){

    contenedor.innerHTML = '';

    new QRCode(
        contenedor,
        {
            text:url,
            width:220,
            height:220,
            correctLevel:QRCode.CorrectLevel.M
        }
    );

}


/* =========================================================
   CREAR CUADRO
========================================================= */

botonCrear.addEventListener(
'click',
async function(){

    const id =
    inputId.value.trim();

    const nombre =
    inputNombre.value.trim();

    const archivoMind =
    inputMind.files[0];

    const archivoVideo =
    inputVideo.files[0];


    /* VALIDACIONES */

    if(!nombre){

        alert(
            'Escribe el nombre o cliente.'
        );

        return;

    }


    if(!archivoMind){

        alert(
            'Selecciona el archivo .mind.'
        );

        return;

    }


    if(!archivoVideo){

        alert(
            'Selecciona el video.'
        );

        return;

    }


    if(
        archivoMind.name
        .toLowerCase()
        .slice(-5)
        !== '.mind'
    ){

        alert(
            'El archivo Target debe ser .mind'
        );

        return;

    }


    /* LÍMITE 50 MB */

    const limite =
    50 * 1024 * 1024;

    if(
        archivoVideo.size > limite
    ){

        alert(
            'El video supera los 50 MB.'
        );

        return;

    }


    botonCrear.disabled = true;


    try{

        /* -----------------------------------------
           1. SUBIR TARGET
        ----------------------------------------- */

        mostrarEstado(
            '📷 Subiendo target AR...\n\n' +
            archivoMind.name
        );


        const rutaMind =
        'targets/' +
        id +
        '.mind';


        const mindUrl =
        await subirArchivo(
            archivoMind,
            rutaMind
        );


        /* -----------------------------------------
           2. SUBIR VIDEO
        ----------------------------------------- */

        mostrarEstado(
            '🎬 Subiendo video...\n\n' +
            archivoVideo.name
        );


        const extension =
        obtenerExtensionVideo(
            archivoVideo.name
        );


        const rutaVideo =
        'videos/' +
        id +
        '.' +
        extension;


        const videoUrl =
        await subirArchivo(
            archivoVideo,
            rutaVideo
        );


        /* -----------------------------------------
           3. CREAR URL AR
        ----------------------------------------- */

        /*
         * ESTA ES LA PARTE FUNDAMENTAL.
         *
         * El QR ahora lleva las URLs exactas
         * del target y del video.
         */

        const arUrl =
            AR_BASE +
            '?id=' +
            encodeURIComponent(id) +
            '&target=' +
            encodeURIComponent(mindUrl) +
            '&video=' +
            encodeURIComponent(videoUrl);


        /* -----------------------------------------
           4. GUARDAR PROYECTO
        ----------------------------------------- */

        const proyectos =
        obtenerProyectos();


        const proyecto = {

            id:id,

            name:nombre,

            url:arUrl,

            video:videoUrl,

            target:mindUrl,

            videoFile:rutaVideo,

            targetFile:rutaMind,

            created:new Date().toISOString()

        };


        proyectos.push(
            proyecto
        );


        guardarProyectos(
            proyectos
        );


        /* -----------------------------------------
           5. LIMPIAR
        ----------------------------------------- */

        inputNombre.value = '';

        inputMind.value = '';

        inputVideo.value = '';


        prepararNuevoId();


        mostrarEstado(
            '✅ CUADRO CREADO CORRECTAMENTE\n\n' +
            'ID: ' + id + '\n' +
            'Cliente: ' + nombre + '\n\n' +
            'El QR ya está asociado al target y video correctos.'
        );


        renderizarLista();


        /* -----------------------------------------
           6. SCROLL A LA LISTA
        ----------------------------------------- */

        setTimeout(function(){

            window.scrollTo({
                top:document.body.scrollHeight,
                behavior:'smooth'
            });

        },300);


    }catch(error){

        console.error(
            'ERROR AL CREAR:',
            error
        );


        mostrarEstado(
            '❌ NO SE PUDO CREAR EL CUADRO\n\n' +
            error.message
        );

        alert(
            'Error al subir los archivos:\n\n' +
            error.message
        );


    }finally{

        botonCrear.disabled = false;

    }

});


/* =========================================================
   RENDERIZAR LISTA
========================================================= */

function renderizarLista(){

    const proyectos =
    obtenerProyectos();


    lista.innerHTML = '';


    if(
        proyectos.length === 0
    ){

        lista.innerHTML =
        '<div id="sinProyectos">' +
        'Todavía no tienes cuadros creados.' +
        '</div>';

        return;

    }


    proyectos
    .slice()
    .reverse()
    .forEach(function(p){

        const div =
        document.createElement('div');

        div.className =
        'proyecto';


        div.innerHTML = `

            <h3>
                🖼️ Cuadro ${escapeHTML(p.id)}
            </h3>

            <div class="info">

                <strong>Cliente:</strong>
                ${escapeHTML(p.name)}

                <br><br>

                <strong>Target:</strong><br>
                ${escapeHTML(p.target)}

                <br><br>

                <strong>Video:</strong><br>
                ${escapeHTML(p.video)}

            </div>

            <div
                class="qr"
                id="qr-${escapeHTML(p.id)}"
            ></div>

            <div class="botones">

                <button
                    class="btn"
                    onclick="abrirAR('${encodeURIComponent(p.url)}')"
                >
                    📱 Probar AR
                </button>

                <button
                    class="btn"
                    onclick="abrirVideo('${encodeURIComponent(p.video)}')"
                >
                    🎬 Ver video
                </button>

                <button
                    class="btnSec"
                    onclick="copiarURL('${encodeURIComponent(p.url)}')"
                >
                    🔗 Copiar URL
                </button>

                <button
                    class="btnDanger"
                    onclick="eliminarProyecto('${encodeURIComponent(p.id)}')"
                >
                    🗑️ Eliminar
                </button>

            </div>

        `;


        lista.appendChild(
            div
        );


        const qrContenedor =
        document.getElementById(
            'qr-' + p.id
        );


        crearQR(
            qrContenedor,
            p.url
        );

    });

}


/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escapeHTML(texto){

    return String(texto)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

}


/* =========================================================
   ABRIR AR
========================================================= */

function abrirAR(url){

    window.open(
        decodeURIComponent(url),
        '_blank'
    );

}


/* =========================================================
   ABRIR VIDEO
========================================================= */

function abrirVideo(url){

    window.open(
        decodeURIComponent(url),
        '_blank'
    );

}


/* =========================================================
   COPIAR URL
========================================================= */

async function copiarURL(url){

    const texto =
    decodeURIComponent(url);

    try{

        await navigator.clipboard.writeText(
            texto
        );

        alert(
            'URL copiada.'
        );

    }catch(error){

        prompt(
            'Copia esta URL:',
            texto
        );

    }

}


/* =========================================================
   ELIMINAR PROYECTO
========================================================= */

function eliminarProyecto(id){

    const confirmar =
    confirm(
        '¿Eliminar este cuadro del panel?\n\n' +
        'Los archivos de Supabase no se borrarán.'
    );


    if(!confirmar){

        return;

    }


    const proyectos =
    obtenerProyectos();


    const nuevos =
    proyectos.filter(
        function(p){

            return p.id !== id;

        }
    );


    guardarProyectos(
        nuevos
    );


    renderizarLista();

    prepararNuevoId();

}


/* =========================================================
   INICIO
========================================================= */

renderizarLista();


</script>

</body>
</html>
